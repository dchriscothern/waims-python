name: WAIMS Evidence Review

on:
  schedule:
    # 13:00 UTC Monday = 8:00 AM America/Chicago during daylight saving time.
    # GitHub Actions cron uses UTC, so this will run at 7:00 AM during standard time.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run evidence monitor
        run: python research_monitor.py --days 7 --save --html

      - name: Set date
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # main is protected against direct pushes (PR required), so a plain
      # `git push` here fails every run -- open a PR instead and let the
      # weekly evidence review land through the normal review process.
      - name: Open PR with updated review artifacts
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            research_log.json
            research_report_*.html
          commit-message: "Evidence review ${{ steps.date.outputs.today }}"
          committer: "WAIMS Evidence Monitor <monitor@waims>"
          author: "WAIMS Evidence Monitor <monitor@waims>"
          title: "Evidence review ${{ steps.date.outputs.today }}"
          body: |
            Automated weekly evidence review — PubMed + RSS scan of the last 7 days.

            Opened as a PR (instead of pushing directly) because `main` requires
            pull requests for all changes.
          branch: "evidence-review-${{ github.run_id }}"
          delete-branch: true
